[package]
name = "wifi-tracker"
version = "0.1.0"
edition = "2021"

# Bộ version cùng thế hệ esp-hal 1.0 / esp-radio 0.17 (API: esp_radio::init() + wifi::new(&ctrl, WIFI, cfg)).
# Dùng "~" để khoá minor, tránh cargo kéo lên 1.0.0-beta (API khác).
[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s2", "unstable"] }
esp-rtos = { version = "~0.2", features = ["esp32s2", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "~0.17", features = ["esp32s2", "wifi", "unstable", "esp-alloc"] }
esp-alloc = { version = "~0.9", features = ["esp32s2"] }
esp-storage = { version = "~0.8", features = ["esp32s2"] }
esp-backtrace = { version = "~0.18", features = ["esp32s2", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "~0.4", features = ["esp32s2"] }
embedded-storage = "0.3"
embassy-executor = "0.9"
embassy-net = { version = "0.7", features = ["tcp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-time = "0.5"
embassy-futures = "0.1"
reqwless = { version = "0.13", default-features = false, features = ["alloc"] }
static_cell = "2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
