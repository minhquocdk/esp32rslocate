name: build-firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust toolchain cho Xtensa (ESP32-S2)
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s2
          ldproxy: false

      - uses: Swatinem/rust-cache@v2
      - name: Cài espflash
        run: cargo install espflash --locked
      - name: In phiên bản công cụ
        run: |
          rustc --version --verbose
          cargo --version
          rustup toolchain list
          espflash --version

      - name: Resolve dependency và in phiên bản các crate
        run: |
          cargo generate-lockfile
          echo "=== Các crate esp / embassy / reqwless ==="
          grep -A1 -E '^name = "(esp-|embassy-|reqwless|static_cell|embedded-storage|xtensa|smoltcp)' Cargo.lock \
            | grep -v '^--' | paste - - | sed 's/name = //; s/version = //'
          echo "=== Crate bị trùng nhiều phiên bản ==="
          cargo tree -d || true

      - name: Lưu Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
      - name: Build
        run: cargo build --release

      - name: Tạo file .bin gộp (bootloader + partition + app)
        run: |
          espflash save-image --chip esp32s2 --merge --flash-size 4mb \
            --partition-table partitions.csv \
            target/xtensa-esp32s2-none-elf/release/wifi-tracker firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware.bin
